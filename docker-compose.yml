services:
  postgres:
    image: postgres:16-alpine
    container_name: xinyi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xinyi_dental}
      POSTGRES_USER: ${POSTGRES_USER:-xinyi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xinyi_mock_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xinyi} -d ${POSTGRES_DB:-xinyi_dental}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xinyi-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xinyi}:${POSTGRES_PASSWORD:-xinyi_mock_2026}@postgres:5432/${POSTGRES_DB:-xinyi_dental}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xinyi-worker
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xinyi}:${POSTGRES_PASSWORD:-xinyi_mock_2026}@postgres:5432/${POSTGRES_DB:-xinyi_dental}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
